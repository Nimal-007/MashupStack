<!DOCTYPE html>
<html>
<head>
	<title>Bakery Feedback</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
    <h2 class="my-4"><b>Modern Bakery</b></h2>
    <div class="form-group">
        <label for="textarea">Name:</label>
        <input type="text" class="form-control" id="Name" placeholder="Enter your Name">
        </div>
    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email">
        </div>
    <div class="form-group">
        <label for="feedback">Feedback :</label>
        <textarea class="form-control" rows="4" id="feedback" placeholder="Enter your feedback"></textarea>
        </div>
        <div class="mb-4">
          <label for="orderType" class="form-label">Methode of Contact :</label>
          <select class="form-select" id="orderType" required>
            <option value="">Select</option>
            <option value="Cake">Phone</option>
            <option value="Cookies">Email</option>
          </select>
        </div>
       <label>Rating :</label> <br>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 1
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 2
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 3
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 4
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 5
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 6
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 7
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 8
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 9
        </label>
        </div>
    <div class="form-check-inline">
        <label class="form-check-label">
            <input type="radio" class="form-check-input"> 10
        </label>
        </div><br><br>
        <div class="mb-4">
          <label for="orderType" class="form-label">Type of Order:</label>
          <select class="form-select" id="orderType" required>
            <option value="">Select your order type</option>
            <option value="Cake">Cake</option>
            <option value="Cookies">Cookies</option>
            <option value="Pastries">Pastries</option>
          </select>
        </div><br>
        <div class="text-center">
          <button type="submit" class="btn btn-primary px-5">Submit Feedback</button>
        </div>
</body>
</html>
