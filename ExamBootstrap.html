<!DOCTYPE html>
<html>
<head>
	<title>Sign Up Form</form></title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow w-75 h-50" >
    <h1 class="text mb-3"><b>Sign Up</b></h1>
    <p class="text-muted">Please fill in this form to Create an account</p>
    <form>
      <div class="row">
        <div class="col">
          <div class="form-group">
          <input type="text" class="form-control border-0 bg-light" placeholder="First Name">
        </div>
        </div>
        <div class="col-sm">
          <div class="form-group">
          <input type="text" class="form-control border-0 bg-light" placeholder="Last Name">
          </div>
        </div>
      </div><br>
      <div class="form-group">
      <input type="email" class="form-control border-0 bg-light" placeholder="Email">
      </div>
      <div class="form-group">
      <input type="password" class="form-control border-0 bg-light" placeholder="Password">
      </div>
      <div class="form-group">
      <input type="password" class="form-control border-0 bg-light" placeholder="Confirm Password">
</div>
      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="terms">
        <label class="form-check-label" for="terms">
          <p class="text-muted">I accept the <a href="">Terms of Use & Privacy Policy</a></p>
        </label>
      </div>

      <button type="submit" class="btn btn-primary px-5">Sign Up</button>
    </form>
  </di>
  <div class="text-center mt-3">
      <p class = "text-light"><small>Already have an account? <a href="" class="text-light"><u>Login here</u></a></small></p>
  </div>
  </div>
</body>
</html>
