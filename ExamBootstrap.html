<!DOCTYPE html>
<html>
<head>
	<title>Sign Up Form</form></title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="width: 700px;">
    <h1 class="text mb-3"><b>Sign Up</b></h1>
    <form>
      <div class="row">
        <div class="col">
          <input type="text" class="form-control mb-3" placeholder="First Name">
        </div>
        <div class="col">
          <input type="text" class="form-control mb-3" placeholder="Last Name">
        </div>
      </div>
      <input type="email" class="form-control mb-3" placeholder="Email">
      <input type="password" class="form-control mb-3" placeholder="Password">
      <input type="password" class="form-control mb-3" placeholder="Confirm Password">

      <div class="form-check mb-3">
        <input type="checkbox" class="form-check-input" id="terms">
        <label class="form-check-label" for="terms">
          I accept the <a href="">Terms of Use & Privacy Policy</a>
        </label>
      </div>

      <button type="submit" class="btn btn-primary">Sign Up</button>
    </form>
  </div>
<br><br>
  <div class="text-center mt-3">
    <div class = "container-fluid">
      <p class = "text-light"><small>Already have an account? <a href="">Login here</a></small></p>
    </div>
  </div>
</body>
</html>
